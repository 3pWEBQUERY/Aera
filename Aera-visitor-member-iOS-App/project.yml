name: Aera
options:
  bundleIdPrefix: so.aera
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Ohne diese Marke haelt Xcode das Projekt fuer veraltet und blendet
# „Update to recommended settings" ein. Die Einstellungen darunter sind
# genau die, die Xcode dabei vorschlaegt — beim Anheben mitziehen.
attributes:
  LastUpgradeCheck: "2660"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: de
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Aera:
    type: application
    platform: iOS
    sources:
      - path: Aera
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.aera.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Erlaubt sind Hoch- und Querformat; welche Lage tatsächlich gilt,
        # entscheidet AeraAppDelegate (siehe App/OrientationGate.swift).
        # Quer dreht allein der Live-Raum.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Aera
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Aera/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleDisplayName: Aera
        # Muss hier stehen, nicht als INFOPLIST_KEY_*-Build-Setting: das Ziel
        # hat ein eigenes Info.plist, die Schlüssel-Settings greifen nur bei
        # GENERATE_INFOPLIST_FILE. Ohne die beiden Texte blendet WKWebView
        # `navigator.mediaDevices` aus — dann kommt im Studio
        # „undefined is not an object (getUserMedia)".
        NSCameraUsageDescription: "Für Live-Sendungen aus dem Studio überträgt Aera dein Kamerabild an deine Mitglieder."
        NSMicrophoneUsageDescription: "Für Live-Sendungen aus dem Studio überträgt Aera deinen Ton an deine Mitglieder."
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleLocalizations:
          [de, en, en-GB, da, es, es-419, fr, it, ja, ko, nb, nl, pl, pt-BR, ru, sv, uk, zh-Hans, zh-Hant]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
schemes:
  Aera:
    build:
      targets:
        Aera: all
    run:
      config: Debug
      storeKitConfiguration: Aera/Aera.storekit
